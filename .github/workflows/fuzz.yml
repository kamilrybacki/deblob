name: fuzz
# Fuzzing is slow, so this runs on a nightly cron rather than on every push
# (see ci.yml for the fast per-push/PR checks). It hardens the
# deblob-fingerprint parser, the untrusted-input security boundary (Task 4).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      # The repo's rust-toolchain.toml pins `stable`, which overrides the nightly
      # installed above — so cargo-fuzz built the sanitizer target with stable
      # rustc and `-Zsanitizer=address` was rejected ("`-Z` only on nightly").
      # `cargo +nightly` sets RUSTUP_TOOLCHAIN=nightly, which takes precedence
      # over rust-toolchain.toml in the inner `cargo build` cargo-fuzz spawns.
      - run: cargo +nightly fuzz run parse_fuzz -- -max_total_time=60
        working-directory: crates/deblob-fingerprint
      - name: Upload crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-parse_fuzz
          path: crates/deblob-fingerprint/fuzz/artifacts/parse_fuzz/
          if-no-files-found: ignore
