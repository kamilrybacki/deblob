# Mock downstream ETL — consumes ONLY events.demo.orders.normalized and validates
# the original v1 contract. Stays green (errors=0) through drift both ways because
# the normalizer only ever emits complete canonical records.
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-etl, namespace: deblob-demo, labels: {app: demo-etl}}
spec:
  replicas: 1
  selector: {matchLabels: {app: demo-etl}}
  template:
    metadata: {labels: {app: demo-etl}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: etl
        image: python:3.12-slim
        command: ["sh", "-c", "pip install --user --quiet --no-cache-dir confluent-kafka && exec python /app/etl.py"]
        env:
        - {name: HOME, value: /tmp}
        - {name: BOOTSTRAP, value: "redpanda.deblob.svc.cluster.local:9092"}
        - {name: NORMALIZED_TOPIC, value: "events.demo.orders.normalized"}
        - {name: GROUP, value: "demo-etl"}
        ports: [{name: http, containerPort: 8080}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 160Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 20, periodSeconds: 5, failureThreshold: 30}
        volumeMounts:
        - {name: src, mountPath: /app, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: src, configMap: {name: demo-etl-src}}
      - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: demo-etl, namespace: deblob-demo, labels: {app: demo-etl}}
spec:
  selector: {app: demo-etl}
  ports: [{name: http, port: 8080, targetPort: 8080}]
