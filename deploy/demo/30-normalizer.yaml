# Deblob NORMALIZER — reads the deblob-schema-id header on events.tagged, keeps an
# accreting canonical superset + a per-shape transform, and produces canonical
# records to events.demo.orders.normalized. DEBLOB_TOKEN (schema id->leaves
# resolution) from secret demo-deblob-token, seeded by deploy.sh; it degrades to
# payload-derived leaves without it.
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-normalizer, namespace: deblob-demo, labels: {app: demo-normalizer}}
spec:
  replicas: 1
  selector: {matchLabels: {app: demo-normalizer}}
  template:
    metadata: {labels: {app: demo-normalizer}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: normalizer
        image: python:3.12-slim
        command: ["sh", "-c", "pip install --user --quiet --no-cache-dir confluent-kafka && exec python /app/normalizer.py"]
        env:
        - {name: HOME, value: /tmp}
        - {name: BOOTSTRAP, value: "redpanda.deblob.svc.cluster.local:9092"}
        - {name: TAGGED_TOPIC, value: "events.tagged"}
        - {name: NORMALIZED_TOPIC, value: "events.demo.orders.normalized"}
        - {name: ORIGIN_PREFIX, value: "events.demo.orders"}
        - {name: GROUP, value: "demo-normalizer"}
        - {name: DEBLOB_API, value: "http://deblob-mgmt.deblob.svc.cluster.local:9615"}
        - name: DEBLOB_TOKEN
          valueFrom: {secretKeyRef: {name: demo-deblob-token, key: token, optional: true}}
        ports: [{name: http, containerPort: 8080}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 160Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 20, periodSeconds: 5, failureThreshold: 30}
        volumeMounts:
        - {name: src, mountPath: /app, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: src, configMap: {name: demo-normalizer-src}}
      - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: demo-normalizer, namespace: deblob-demo, labels: {app: demo-normalizer}}
spec:
  selector: {app: demo-normalizer}
  ports: [{name: http, port: 8080, targetPort: 8080}]
